[project]
name = "sparse-attention-from-scratch"
version = "0.1.0"
description = "Sparse attention implemented by hand, with a correctness harness and benchmarks."
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
